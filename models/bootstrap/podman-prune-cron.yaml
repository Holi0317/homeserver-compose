type: '@adam/cfgmgmt/cron'
typeVersion: 2026.03.18.1
id: e0e32131-e20e-4e4e-adb4-bb186d6cf2a3
name: bootstrap-podman-prune-cron
version: 1
tags: {}
globalArguments:
  name: podman-image-prune
  ensure: present
  command: /usr/bin/podman image prune -f
  user: root
  minute: '0'
  hour: '4'
  day: '*'
  month: '*'
  weekday: '0'
  nodeHost: '${{ data.latest("athena", "host-athena").attributes.address }}'
  nodeUser: '${{ data.latest("athena", "host-athena").attributes.user }}'
  nodePort: '${{ data.latest("athena", "host-athena").attributes.port }}'
  become: true
  becomeUser: root
methods: {}
