type: '@adam/cfgmgmt/file'
typeVersion: 2026.03.18.1
id: c256aace-93a1-43f7-915b-b7f30186fdd8
name: bootstrap-journald-size
version: 1
tags: {}
globalArguments:
  path: /etc/systemd/journald.conf.d/99-size-limit.conf
  ensure: present
  content: |
    [Journal]
    SystemMaxUse=512M
    RuntimeMaxUse=64M
  owner: root
  group: root
  mode: '0644'
  nodeHost: '${{ data.latest("athena", "host-athena").attributes.address }}'
  nodeUser: '${{ data.latest("athena", "host-athena").attributes.user }}'
  nodePort: '${{ data.latest("athena", "host-athena").attributes.port }}'
  become: true
  becomeUser: root
methods: {}
