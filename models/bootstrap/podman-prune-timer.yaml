globalArguments:
  remote:
    fleet: athena
    host: athena
    sudo: true
  unitName: podman-image-prune.timer
  content: |
    [Unit]
    Description=Weekly prune of dangling Podman images

    [Timer]
    OnCalendar=Sun *-*-* 04:00:00
    Persistent=true

    [Install]
    WantedBy=timers.target
  userMode: system
