type: '@adam/cfgmgmt/file'
typeVersion: 2026.03.18.1
id: a4b6ae14-1b50-4535-8ab8-c864ccb4bd3a
name: bootstrap-coredump-limit
version: 1
tags: {}
globalArguments:
  path: /etc/systemd/coredump.conf.d/99-limit.conf
  ensure: present
  content: |
    [Coredump]
    Storage=external
    MaxUse=1G
  owner: root
  group: root
  mode: '0644'
  nodeHost: '${{ data.latest("hetzner", "host-hetzner").attributes.address }}'
  nodeUser: '${{ data.latest("hetzner", "host-hetzner").attributes.user }}'
  nodePort: '${{ data.latest("hetzner", "host-hetzner").attributes.port }}'
  become: true
  becomeUser: root
methods: {}
