type: '@holi0317/systemd/unit'
typeVersion: 2026.08.16.2
id: c2778b7f-fae7-4d53-857d-8740cf2b0522
name: caddy-config-dir
version: 1
tags: {}
globalArguments:
  remote:
    fleet: athena
    host: athena
    sudo: true
  unitName: caddy-config-dir.service
  content: |
    [Unit]
    Description=Prepare Caddy persistent configuration directory
    RequiresMountsFor=/srv/persistent
    Before=caddy.service

    [Service]
    Type=oneshot
    ExecStart=/usr/bin/install -d -o 0 -g 1000 -m 0750 /srv/persistent/caddy/config
    ExecStart=/bin/sh -c '/usr/bin/printf %s eyJhZG1pbiI6eyJsaXN0ZW4iOiJsb2NhbGhvc3Q6MjAxOSJ9LCJhcHBzIjp7Imh0dHAiOnsic2VydmVycyI6eyJpbmdyZXNzIjp7Imxpc3RlbiI6WyI6ODAiXSwicm91dGVzIjpbeyJtYXRjaCI6W3sicGF0aCI6WyIvaGVhbHRoeiJdfV0sImhhbmRsZSI6W3siaGFuZGxlciI6InN0YXRpY19yZXNwb25zZSIsInN0YXR1c19jb2RlIjoiMjAwIiwiYm9keSI6Im9rIn1dfV19fX19fQ== | /usr/bin/base64 -d > /srv/persistent/caddy/config/caddy.json'
    ExecStart=/usr/bin/chmod 0640 /srv/persistent/caddy/config/caddy.json
    RemainAfterExit=yes

    [Install]
    WantedBy=multi-user.target
  userMode: system
  enabled: true
  state: running
methods:
  apply:
    arguments:
      allowRecreate: false
