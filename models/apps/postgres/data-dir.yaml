type: '@holi0317/systemd/unit'
typeVersion: 2026.08.16.2
id: cf3015ec-9399-4993-9e8d-0eb6aa3af9f8
name: postgres-data-dir
version: 1
tags: {}
globalArguments:
  remote:
    fleet: athena
    host: athena
    sudo: true
  unitName: postgres-data-dir.service
  content: |
    [Unit]
    Description=Prepare PostgreSQL data directory
    RequiresMountsFor=/srv/persistent
    Before=postgres.service

    [Service]
    Type=oneshot
    ExecStart=/usr/bin/install -d -o 70 -g 70 -m 0750 /srv/persistent/postgres/16
    RemainAfterExit=yes

    [Install]
    WantedBy=multi-user.target
  userMode: system
  enabled: true
  state: running
methods:
  apply:
    arguments:
      allowRecreate: false
