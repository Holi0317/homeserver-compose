type: '@holi0317/systemd/quadlet'
typeVersion: 2026.08.16.2
id: 83183346-1182-452f-a357-839b34a6bb99
name: apps-postgres-container
version: 1
tags: {}
globalArguments:
  remote:
    fleet: athena
    host: athena
    sudo: true
  unitName: postgres.container
  content: |
    [Unit]
    Description=Postgres 16
    Wants=postgres-network.service
    After=postgres-network.service postgres-data-dir.service
    Requires=postgres-data-dir.service
    RequiresMountsFor=/srv/persistent/postgres/16

    [Container]
    Image=docker.io/library/postgres:16-alpine
    ContainerName=postgres
    User=70:70
    Environment=POSTGRES_USER=postgres
    Environment=POSTGRES_DB=postgres
    Environment=POSTGRES_PASSWORD=${{ vault.get(homelab, postgres.superuser) }}
    Environment=POSTGRES_HOST_AUTH_METHOD=scram-sha-256
    Environment=POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 --encoding=UTF8 --locale=en_US.UTF8
    Volume=/srv/persistent/postgres/16:/var/lib/postgresql/data:Z
    PublishPort=127.0.0.1:5432:5432
    Network=postgres.network
    HealthCmd=pg_isready -U postgres
    HealthInterval=10s
    HealthTimeout=5s
    HealthRetries=5
    HealthStartPeriod=30s

    [Service]
    Restart=always
    RestartSec=5

    [Install]
    WantedBy=default.target
  userMode: system
  enabled: true
  state: running
methods:
  apply:
    arguments:
      allowRecreate: false
