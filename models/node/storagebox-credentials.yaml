type: '@adam/cfgmgmt/file'
typeVersion: 2026.03.18.1
id: 7a1c2b8e-3f9d-4e6a-b5c8-1d2e3f4a5b6c
name: storagebox-credentials
version: 1
tags: {}
globalArguments:
  path: /etc/cifs/storagebox.creds
  ensure: present
  content: |
    username=${{ vault.get(homelab, hetzner.storagebox.user) }}
    password=${{ vault.get(homelab, hetzner.storagebox.password) }}
  owner: root
  group: root
  mode: '0600'
  nodeHost: '${{ data.latest("athena", "host-athena").attributes.address }}'
  nodeUser: '${{ data.latest("athena", "host-athena").attributes.user }}'
  nodePort: '${{ data.latest("athena", "host-athena").attributes.port }}'
  become: true
  becomeUser: root
methods: {}
