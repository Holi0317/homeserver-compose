id: 6ac691dc-bb7e-439f-a9bc-ed07e1d94d99
name: machine-storage
version: 1
description: Mount persistent storage and deploy Postgres on it.
tags: {}
jobs:
  - name: storage
    description: Prepare /srv/persistent and move Postgres onto it
    weight: 0
    dependsOn: []
    steps:
      - name: persistent-mount
        description: Manage the native systemd mount for /srv/persistent
        task:
          type: model_method
          modelIdOrName: persistent-mount
          methodName: apply
        dependsOn: []
        allowFailure: false

      - name: postgres-data-dir
        description: Deploy the systemd unit that prepares the Postgres data directory
        task:
          type: model_method
          modelIdOrName: postgres-data-dir
          methodName: apply
        dependsOn:
          - step: persistent-mount
            condition:
              type: succeeded
        allowFailure: false

      - name: postgres-network
        description: Deploy Postgres podman network
        task:
          type: model_method
          modelIdOrName: apps-postgres-network
          methodName: apply
        dependsOn:
          - step: postgres-data-dir
            condition:
              type: succeeded
        allowFailure: false

      - name: postgres-container
        description: Deploy Postgres container on /srv/persistent
        task:
          type: model_method
          modelIdOrName: apps-postgres-container
          methodName: apply
        dependsOn:
          - step: postgres-network
            condition:
              type: succeeded
        allowFailure: false

      - name: postgres-ready
        description: Wait for Postgres to be ready
        task:
          type: model_method
          modelIdOrName: apps-postgres-ready
          methodName: apply
        dependsOn:
          - step: postgres-container
            condition:
              type: succeeded
        allowFailure: false

      - name: postgres-role
        description: Adopt the bootstrap PostgreSQL role under Swamp management
        task:
          type: model_method
          modelIdOrName: postgres-role
          methodName: apply
        dependsOn:
          - step: postgres-ready
            condition:
              type: succeeded
        allowFailure: false

      - name: postgres-database
        description: Adopt the default PostgreSQL database under Swamp management
        task:
          type: model_method
          modelIdOrName: postgres-database
          methodName: apply
        dependsOn:
          - step: postgres-role
            condition:
              type: succeeded
        allowFailure: false
