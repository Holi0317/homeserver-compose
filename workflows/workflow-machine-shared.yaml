id: 8d80fdfc-aadf-4016-a96d-ee16f4d07a81
name: machine-shared
version: 1
description: Deploy the shared Valkey cache service.
tags: {}
jobs:
  - name: shared
    description: Provision the shared Valkey cache and its ACL boundary.
    steps:
      - name: valkey-data-dir
        description: Prepare the persistent Valkey data directory and ACL bootstrap
        task:
          type: model_method
          modelIdOrName: valkey-data-dir
          methodName: apply
        dependsOn: []
        weight: 0
        allowFailure: false

      - name: valkey-network
        description: Apply the private Valkey container network
        task:
          type: model_method
          modelIdOrName: valkey-network
          methodName: apply
        dependsOn: []
        weight: 0
        allowFailure: false

      - name: valkey-container
        description: Start the shared Valkey container
        task:
          type: model_method
          modelIdOrName: valkey-container
          methodName: apply
        dependsOn:
          - step: valkey-data-dir
            condition:
              type: succeeded
          - step: valkey-network
            condition:
              type: succeeded
        weight: 0
        allowFailure: false

      - name: valkey-default-user
        description: Converge the default ACL user with its vault credential
        task:
          type: model_method
          modelIdOrName: valkey-default-user
          methodName: apply
        dependsOn:
          - step: valkey-container
            condition:
              type: succeeded
        weight: 0
        allowFailure: false

      - name: valkey-ready
        description: Verify Valkey answers authenticated pings
        task:
          type: model_method
          modelIdOrName: valkey-ready
          methodName: apply
        dependsOn:
          - step: valkey-container
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
