id: a81682a0-afcc-47f5-b879-01bad3d93020
name: machine
version: 1
description: Converge the Athena machine to its declared desired state.
tags: {}
jobs:
  - name: bootstrap
    description: Bootstrap the machine with base OS configuration and persistent storage.
    steps:
      - name: machine-bootstrap
        description: Run the machine bootstrap domain workflow.
        task:
          type: workflow
          workflowIdOrName: machine-bootstrap
        dependsOn: []
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0

  - name: caddy
    description: Converge the shared Caddy ingress edge.
    steps:
      - name: app-caddy
        description: Run the Caddy app workflow.
        task:
          type: workflow
          workflowIdOrName: app-caddy
        dependsOn: []
        weight: 0
        allowFailure: false
    dependsOn:
      - job: bootstrap
        condition:
          type: succeeded
    weight: 0

  - name: postgres
    description: Deploy PostgreSQL on the persistent volume.
    steps:
      - name: app-postgres
        description: Run the Postgres app workflow.
        task:
          type: workflow
          workflowIdOrName: app-postgres
        dependsOn: []
        weight: 0
        allowFailure: false
    dependsOn:
      - job: bootstrap
        condition:
          type: succeeded
    weight: 0

  - name: valkey
    description: Deploy the shared Valkey cache.
    steps:
      - name: app-valkey
        description: Run the Valkey app workflow.
        task:
          type: workflow
          workflowIdOrName: app-valkey
        dependsOn: []
        weight: 0
        allowFailure: false
    dependsOn:
      - job: bootstrap
        condition:
          type: succeeded
    weight: 0

  - name: victoriametrics
    description: Deploy the VictoriaMetrics metrics store.
    steps:
      - name: app-victoriametrics
        description: Run the VictoriaMetrics app workflow.
        task:
          type: workflow
          workflowIdOrName: app-victoriametrics
        dependsOn: []
        weight: 0
        allowFailure: false
    dependsOn:
      - job: bootstrap
        condition:
          type: succeeded
    weight: 0

  - name: zitadel
    description: Deploy Zitadel identity behind the shared ingress.
    steps:
      - name: app-zitadel
        description: Run the Zitadel app workflow.
        task:
          type: workflow
          workflowIdOrName: app-zitadel
        dependsOn: []
        weight: 0
        allowFailure: false
    dependsOn:
      - job: caddy
        condition:
          type: succeeded
      - job: postgres
        condition:
          type: succeeded
    weight: 0

  - name: victorialogs
    description: Deploy the VictoriaLogs store and Vector shipper.
    steps:
      - name: app-victorialogs
        description: Run the VictoriaLogs app workflow.
        task:
          type: workflow
          workflowIdOrName: app-victorialogs
        dependsOn: []
        weight: 0
        allowFailure: false
    dependsOn:
      - job: victoriametrics
        condition:
          type: succeeded
    weight: 0

  - name: nextcloud
    description: Provision Nextcloud database objects and secret.
    steps:
      - name: app-nextcloud
        description: Run the Nextcloud app workflow.
        task:
          type: workflow
          workflowIdOrName: app-nextcloud
        dependsOn: []
        weight: 0
        allowFailure: false
    dependsOn:
      - job: postgres
        condition:
          type: succeeded
    weight: 0

  - name: grafana
    description: Deploy Grafana with database, OIDC app, and tailnet exposure.
    steps:
      - name: app-grafana
        description: Run the Grafana app workflow.
        task:
          type: workflow
          workflowIdOrName: app-grafana
        dependsOn: []
        weight: 0
        allowFailure: false
    dependsOn:
      - job: caddy
        condition:
          type: succeeded
      - job: postgres
        condition:
          type: succeeded
      - job: victoriametrics
        condition:
          type: succeeded
      - job: zitadel
        condition:
          type: succeeded
    weight: 0
