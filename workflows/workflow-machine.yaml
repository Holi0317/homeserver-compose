id: a81682a0-afcc-47f5-b879-01bad3d93020
name: machine
version: 1
description: Converge the Athena machine to its declared desired state.
tags: {}
jobs:
  - name: bootstrap
    description: Bootstrap the machine with base OS configuration.
    steps:
      - name: machine-bootstrap
        description: Run the machine bootstrap domain workflow.
        task:
          type: workflow
          workflowIdOrName: machine-bootstrap
        dependsOn: []
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0

  - name: storage
    description: Deploy persistent storage and PostgreSQL.
    steps:
      - name: machine-storage
        description: Run the storage and PostgreSQL domain workflow.
        task:
          type: workflow
          workflowIdOrName: machine-storage
        dependsOn: []
        weight: 0
        allowFailure: false
    dependsOn:
      - job: bootstrap
        condition:
          type: succeeded
    weight: 0

  - name: shared
    description: Deploy the shared Valkey cache service.
    steps:
      - name: machine-shared
        description: Run the shared services domain workflow.
        task:
          type: workflow
          workflowIdOrName: machine-shared
        dependsOn: []
        weight: 0
        allowFailure: false
    dependsOn:
      - job: storage
        condition:
          type: succeeded
    weight: 0

  - name: ingress
    description: Deploy the public Caddy ingress edge.
    steps:
      - name: machine-ingress-public
        description: Run the public ingress domain workflow.
        task:
          type: workflow
          workflowIdOrName: machine-ingress-public
        dependsOn: []
        weight: 0
        allowFailure: false
    dependsOn:
      - job: apps
        condition:
          type: succeeded
    weight: 0

  - name: oidc-apps
    description: Register relying-party OIDC applications in Zitadel.
    steps:
      - name: zitadel-oidc-apps
        description: Run the Zitadel OIDC application registration workflow.
        task:
          type: workflow
          workflowIdOrName: zitadel-oidc-apps
        dependsOn: []
        weight: 0
        allowFailure: false
    dependsOn:
      - job: ingress
        condition:
          type: succeeded
    weight: 0

  - name: apps
    description: Deploy shared services and applications.
    steps:
      - name: machine-apps
        description: Run the applications domain workflow.
        task:
          type: workflow
          workflowIdOrName: machine-apps
        dependsOn: []
        weight: 0
        allowFailure: false
    dependsOn:
      - job: shared
        condition:
          type: succeeded

    weight: 0
