id: b3129a16-a51c-47a7-ba7c-ef1225ef8d7a
name: zitadel-oidc-apps
description: Converge Zitadel OIDC application registrations for relying parties.
tags: {}
jobs:
  - name: oidc-apps
    description: Ensure Zitadel projects, roles, and OIDC applications for relying parties.
    steps:
      - name: grafana-project
        description: Ensure the per-app Grafana project
        task:
          type: model_method
          modelIdOrName: zitadel-iam
          methodName: project_ensure
          inputs:
            name: Grafana
        dependsOn: []
        weight: 0
        allowFailure: false

      - name: grafana-role-admin
        description: Ensure the Grafana admin project role
        task:
          type: model_method
          modelIdOrName: zitadel-iam
          methodName: role_ensure
          inputs:
            project: Grafana
            key: admin
            displayName: Grafana Admin
        dependsOn:
          - step: grafana-project
            condition:
              type: succeeded
        weight: 0
        allowFailure: false

      - name: grafana-role-viewer
        description: Ensure the Grafana viewer project role
        task:
          type: model_method
          modelIdOrName: zitadel-iam
          methodName: role_ensure
          inputs:
            project: Grafana
            key: viewer
            displayName: Grafana Viewer
        dependsOn:
          - step: grafana-project
            condition:
              type: succeeded
        weight: 0
        allowFailure: false

      - name: grafana-app
        description: Ensure the Grafana OIDC application (code flow, confidential client)
        task:
          type: model_method
          modelIdOrName: zitadel-iam
          methodName: oidc_app_ensure
          inputs:
            project: Grafana
            name: grafana
            appType: web
            authMethod: basic
            devMode: false
            redirectUris:
              - https://grafana.tail351aa.ts.net/login/generic_oauth
        dependsOn:
          - step: grafana-project
            condition:
              type: succeeded
        weight: 0
        allowFailure: false

      - name: grafana-authz
        description: Require a Grafana role to authenticate and assert roles into tokens
        task:
          type: model_method
          modelIdOrName: zitadel-iam
          methodName: project_authz_set
          inputs:
            project: Grafana
            roleAssertion: true
            roleCheck: true
        dependsOn:
          - step: grafana-project
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
