id: 2c2fbf26-8b2d-4cce-9d97-e8c8b8167395
name: machine-ingress-tailnet
tags: {}
jobs:
  - name: ingress-tailnet
    description: Apply Caddy and Grafana routing, then advertise HTTPS Service
    steps:
      - name: caddy-cloudflare-secret
        description: Provision the vault-backed Caddy validation secret
        task:
          type: model_method
          modelIdOrName: caddy-cloudflare-secret
          methodName: apply
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: ingress-config-render
        description: Render Caddy public and Grafana tailnet routes
        task:
          type: model_method
          modelIdOrName: ingress-config
          methodName: render
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: ingress-config-apply
        description: Activate the shared Caddy Grafana listener configuration
        task:
          type: model_method
          modelIdOrName: ingress-config
          methodName: apply
          inputs:
            configName: current
        dependsOn:
          - step: ingress-config-render
            condition:
              type: succeeded
          - step: caddy-cloudflare-secret
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: grafana-config
        description: Render Grafana's Zitadel OIDC configuration before the container mounts it
        task:
          type: model_method
          modelIdOrName: grafana-config
          methodName: apply
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: grafana-container
        description: Apply Grafana's private ingress network definition
        task:
          type: model_method
          modelIdOrName: grafana-container
          methodName: apply
        dependsOn:
          - step: ingress-config-apply
            condition:
              type: succeeded
          - step: grafana-config
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: grafana-container-restart
        description: Restart Grafana to attach the private ingress network
        task:
          type: model_method
          modelIdOrName: grafana-container
          methodName: restart
        dependsOn:
          - step: grafana-container
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: caddy-container
        description: Apply Caddy's loopback-only listener definition
        task:
          type: model_method
          modelIdOrName: caddy-container
          methodName: apply
        dependsOn:
          - step: ingress-config-apply
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: caddy-container-restart
        description: Restart Caddy to bind the loopback-only listener
        task:
          type: model_method
          modelIdOrName: caddy-container
          methodName: restart
        dependsOn:
          - step: caddy-container
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: tailscale-serve
        description: Apply and advertise the Grafana HTTPS endpoint
        task:
          type: model_method
          modelIdOrName: tailscale-serve
          methodName: apply
        dependsOn:
          - step: grafana-container-restart
            condition:
              type: succeeded
          - step: caddy-container-restart
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: tailscale-serve-reload
        description: Drain, reapply, advertise, and record HTTPS Serve status
        task:
          type: model_method
          modelIdOrName: tailscale-serve
          methodName: reload
        dependsOn:
          - step: tailscale-serve
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
