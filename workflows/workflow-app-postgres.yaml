id: 26b1bf10-2fad-450a-ae07-1a26740e3096
name: app-postgres
version: 1
description: Deploy PostgreSQL on the persistent volume and adopt its bootstrap objects.
tags: {}
jobs:
  - name: postgres
    description: Provision the PostgreSQL server and its bootstrap role and database
    steps:
      - name: postgres-data-dir
        description: Deploy the systemd unit that prepares the Postgres data directory
        task:
          type: model_method
          modelIdOrName: postgres-data-dir
          methodName: apply
        dependsOn: []
        weight: 0
        allowFailure: false

      - name: postgres-network
        description: Deploy Postgres podman network
        task:
          type: model_method
          modelIdOrName: apps-postgres-network
          methodName: apply
        dependsOn: []
        weight: 0
        allowFailure: false

      - name: postgres-container
        description: Deploy Postgres container on /srv/persistent
        task:
          type: model_method
          modelIdOrName: apps-postgres-container
          methodName: apply
        dependsOn:
          - step: postgres-data-dir
            condition:
              type: succeeded
          - step: postgres-network
            condition:
              type: succeeded
        weight: 0
        allowFailure: false

      - name: postgres-ready
        description: Wait for Postgres to be ready
        task:
          type: model_method
          modelIdOrName: apps-postgres-ready
          methodName: apply
        dependsOn:
          - step: postgres-container
            condition:
              type: succeeded
        weight: 0
        allowFailure: false

      - name: postgres-role
        description: Adopt the bootstrap PostgreSQL role under Swamp management
        task:
          type: model_method
          modelIdOrName: postgres-role
          methodName: apply
        dependsOn:
          - step: postgres-ready
            condition:
              type: succeeded
        weight: 0
        allowFailure: false

      - name: postgres-database
        description: Adopt the default PostgreSQL database under Swamp management
        task:
          type: model_method
          modelIdOrName: postgres-database
          methodName: apply
        dependsOn:
          - step: postgres-role
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
