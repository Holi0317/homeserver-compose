id: c1710938-1e29-4b85-864b-18a2228e5ff7
name: app-jellyfin
version: 1
description: Deploy Jellyfin with persistent config, read-only media, transcoding caps, and Zitadel SSO.
tags: {}
jobs:
  - name: iam
    description: Provision the Zitadel project, roles, OIDC app, and grant for Jellyfin
    steps:
      - name: jellyfin-project
        description: Provision the per-app Jellyfin project with role assertion and check
        task:
          type: model_method
          modelIdOrName: jellyfin-project
          methodName: apply
        dependsOn: []
        weight: 0
        allowFailure: false

      - name: jellyfin-role-admin
        description: Provision the Jellyfin admin project role
        task:
          type: model_method
          modelIdOrName: jellyfin-role-admin
          methodName: apply
        dependsOn:
          - step: jellyfin-project
            condition:
              type: succeeded
        weight: 0
        allowFailure: false

      - name: jellyfin-role-access
        description: Provision the Jellyfin access (login-gate) project role
        task:
          type: model_method
          modelIdOrName: jellyfin-role-access
          methodName: apply
        dependsOn:
          - step: jellyfin-project
            condition:
              type: succeeded
        weight: 0
        allowFailure: false

      - name: jellyfin-oidc-app
        description: Provision the Jellyfin OIDC application (confidential Basic client)
        task:
          type: model_method
          modelIdOrName: jellyfin-oidc-app
          methodName: apply
        dependsOn:
          - step: jellyfin-project
            condition:
              type: succeeded
        weight: 0
        allowFailure: false

      - name: jellyfin-grant-admin
        description: Grant the admin and access roles to the owner login
        task:
          type: model_method
          modelIdOrName: jellyfin-grant-admin
          methodName: apply
        dependsOn:
          - step: jellyfin-role-admin
            condition:
              type: succeeded
          - step: jellyfin-role-access
            condition:
              type: succeeded
        weight: 0
        allowFailure: false

  - name: runtime
    description: Prepare storage and deploy the Jellyfin container
    steps:
      - name: jellyfin-data-dir
        description: Prepare the Jellyfin config, cache, and transcode directories
        task:
          type: model_method
          modelIdOrName: jellyfin-data-dir
          methodName: apply
        dependsOn: []
        weight: 0
        allowFailure: false

      - name: jellyfin-metrics-enable
        description: Flip EnableMetrics=true in the Jellyfin system.xml for the Prometheus /metrics endpoint
        task:
          type: model_method
          modelIdOrName: jellyfin-metrics-enable
          methodName: apply
        dependsOn: []
        weight: 0
        allowFailure: false

      - name: jellyfin-container
        description: Deploy the Jellyfin container unit on the ingress network
        task:
          type: model_method
          modelIdOrName: jellyfin-container
          methodName: apply
        dependsOn:
          - step: jellyfin-data-dir
            condition:
              type: succeeded
          - step: jellyfin-metrics-enable
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
    dependsOn:
      - job: iam
        condition:
          type: succeeded
    weight: 0
